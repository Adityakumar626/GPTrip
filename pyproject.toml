[project]
name = "gptrip"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aditya Kumar", email = "adk622006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "airportsdata>=20260905",
    "fastapi>=0.143.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg>=3.3.6",
    "psycopg-pool>=3.3.3",
    "pycountry>=26.2.16",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily-python>=0.8.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
gptrip = "gptrip:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
